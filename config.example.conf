# =============================================================================
# easynvr-cloud-archive 配置文件模板
# 使用方法: 复制为 config.conf 后按实际环境修改, 再运行主脚本
#   cp config.example.conf config.conf
#   EASYNVR_CFG=/path/to/config.conf bash easynvr_cloud_archive.sh
# =============================================================================

# --- 必填: 通道与路径 ---
# NVR 通道 ID(设备编码), EasyNVR 录像目录里的一层
CH="34020000001320000001"

# 本地录像根目录(注意 EasyNVR 录像目录是 双层通道名: r/easynvr_rec/<CH>/<CH>/)
LOCAL_BASE="/data/easynvr/r/easynvr_rec/${CH}/${CH}"

# rclone remote + 云盘目标路径(remote 需先 rclone config 配好, 如 aliyun:)
# 云端归档结构: <DST_CH>/<YYYYMMDD>/<YYYYMMDD>_HH.mp4
DST_CH="aliyun:/aliyun/easynvr_rec/${CH}"

# 磁盘水位检测挂载点(本地录像所在盘)
MOUNT_POINT="/data"

# --- 可调: 调度 ---
# 窗口制: 本地时间 分钟数 (02:00=120, 04:30=270)
WINDOW_START_MIN=120
WINDOW_END_MIN=270

# 紧急制: 磁盘 >=90% 任意时刻执行, 降到 80% 停
URGENT_TRIGGER_PCT=90
URGENT_STOP_PCT=80

# 本地保留最近 N 天供 NVR 平台近端回放 (2 = 保留今天+昨天, 归档更早)
PROTECT_N=2

# --- 可调: 传输与存储 ---
# rclone --bwlimit 限速; 单位是 Ki/Mi Byte/s!
# 换算警示: 900K = 7.4Mbps(bit), 适合 10Mbps 上行且要求 <=8Mbps 的场景
#           2M  = 16.8Mbps, 很多人误以为 2Mbps, 实际已超标!
BANDWIDTH_LIMIT="900K"

# 碎分片文件名后缀(用于合并后清理云盘残留的旧碎文件)
FRAG_GLOB="*-64000.mp4"

# 合并临时目录/日志/锁文件(按需改, 默认即可)
MERGE_TMP_DIR="/var/tmp/easynvr_merge_tmp"
LOG_FILE="/var/log/easynvr_cloud_archive.log"
LOCK_FILE="/var/lock/easynvr_cloud_archive.lock"

# 外部命令路径(在 PATH 里则无需改)
# FFMPEG_BIN="ffmpeg"
# RCLONE_BIN="rclone"

# =============================================================================
# 以下为 2026-10 新增: 上传窗口 / 封盘静置 / token 自愈(merge_upload 链路使用)
# =============================================================================

# --- 上传窗口: 只在该时段上传, 避开白天在线预览占带宽 ---
# 默认 02:00-04:00; 显式传日期 或 FORCE=1 可跳过窗口限制
UPLOAD_WIN_START_HOUR=2
UPLOAD_WIN_END_HOUR=4

# 合并前要求该小时末片静置秒数, 防止把正在写入的分片合进产物(截断 ~2MB 尾片)
SETTLE_SEC=180

# 本地保留自然日数(2 = 保留今天+昨天, 归档更早日期)
KEEP_LOCAL_DAYS=2

# --- token 自愈链路 ---
# 主 token 文件(个人 token, 2h 有效; 刷新成功会把旧文件备份为 .prev)
TOKEN_FILE="/opt/easynvr-cloud-archive/personal_token.json"
# alist 数据库候选 refresh_token 所在的 storage id(addition 字段)
ALIST_STORAGE_ID=4
# 刷新后实测用的资源库 drive_id(留空则用 /v2/user/get 验证 token 是否可用)
VERIFY_DRIVE_ID=""
# 自愈状态(日报读取: 剩余有效期 + 失败次数)
TOKEN_STATE_FILE="/opt/easynvr-cloud-archive/.token_state.json"
